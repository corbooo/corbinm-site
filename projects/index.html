<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="../assets/img/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/pages/projects.css" />

  <script type="module" src="../assets/js/shared.js"></script>
  <script type="module" src="../assets/js/projects.js"></script>

  <title>Corbin - Projects</title>
</head>

<body>
  <!-- Navigation -->
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__logo" href="../" aria-label="Corbin Moseman - Home">
        <img class="site-nav__logo-image" src="../assets/img/logo.png" alt="" />
      </a>

      <div class="site-nav__links">
        <a class="site-nav__link" href="../about/">About</a>
        <a class="site-nav__link" href="../projects/" aria-current="page">Projects</a>
        <a class="site-nav__link" href="../experience/">Experience</a>

        <a class="site-nav__resume" href="../assets/Resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
      </div>
    </nav>
  </header>

  <!-- Projects page-->
  <main class="site-main projects">
    <!-- Hero -->
    <section class="projects__hero">
      <p class="section-eyebrow">01 / Projects</p>

      <h1 class="projects__title">Things I've built<span class="accent">.</span></h1>

      <p class="hero-description">
        A collection of software, experiments, and ideas brought to life.
      </p>

      <!-- Signature line -->
      <svg class="projects__signature-line signature-line signature-line--draw" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 29 H555 L580 8 H625 L650 29 H1000" vector-effect="non-scaling-stroke" />
      </svg>
    </section>

    <!-- Featured work -->
    <section class="projects__section" aria-labelledby="featuredTitle">
      <p class="section-eyebrow">02 / Selected Work</p>
      <h2 class="projects__section-title" id="featuredTitle">Featured projects</h2>

      <div class="projects__featured" id="featuredProjects"></div>

      <template id="featuredCardTemplate">
        <article class="projects__card">
          <div class="projects__card-top">
            <span class="projects__card-category"></span>
            <span class="projects__card-arrow" aria-hidden="true">↗</span>
          </div>

          <div class="projects__card-content">
            <h3 class="projects__card-title"></h3>
            <p class="projects__card-description"></p>
          </div>

          <div class="projects__card-tags"></div>
        </article>
      </template>

    </section>

    <!-- Remaining projects -->
    <section class="projects__section" aria-labelledby="moreProjectsTitle">
      <p class="section-eyebrow">03 / The Collection</p>
      <h2 class="projects__section-title" id="moreProjectsTitle">More projects</h2>

      <div class="projects__collection" id="moreProjects">

      </div>
    </section>
  </main>

  <!-- Expanded project view -->
  <dialog class="projects__dialog" id="projectDialog" aria-labelledby="projectDialogTitle">
    <div class="projects__dialog-top">
      <span class="projects__dialog-category" id="projectDialogCategory"></span>

      <form method="dialog">
        <button class="projects__dialog-close" type="submit" aria-label="Close project details">
          &times;
        </button>
      </form>
    </div>

    <h2 class="projects__dialog-title" id="projectDialogTitle"></h2>

    <p class="projects__dialog-description" id="projectDialogDescription"></p>
    
    <div class="projects__dialog-tags" id="projectDialogTags"></div>

    <div class="projects__dialog-links">
      <a class="editorial-link" id="projectDialogGitHub" target="_blank" rel="noopener noreferrer" hidden>GitHub ↗</a>
      <a class="editorial-link" id="projectDialogDemo" target="_blank" rel="noopener noreferrer" hidden>Live Demo ↗</a>
    </div>
  </dialog>

  <!-- Footer  -->
  <footer class="site-footer">
    <svg class="site-footer__signature-line" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 29 H340 C420 29 425 8 500 8 C575 8 580 29 660 29 H1000"/>
    </svg>

    <div class="site-footer__inner">
      <p class="site-footer__copy">© <span id="year"></span> Corbin Moseman</p>
      <div class="site-footer__links">
        <a href="mailto:corbinm@pobox.com">Email</a>
        <a href="https://github.com/corbooo" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/corbinmoseman" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </footer>
</body>
</html>
